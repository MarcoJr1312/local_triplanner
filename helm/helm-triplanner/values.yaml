# Agent service. Owns the pgvector index and consumes LocationChanged.
agentService:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 4100

  postgres:
    enabled: true
    image:
      repository: pgvector/pgvector
      tag: "pg17"
      pullPolicy: IfNotPresent
    auth:
      enabled: true
      # DEMO ONLY. Render into triplanner-agent-postgres-credentials.
      username: agent
      password: agent-demo
      database: agent
      existingSecret: ""
      usernameKey: POSTGRES_USER
      passwordKey: POSTGRES_PASSWORD
      databaseKey: POSTGRES_DB
    service:
      port: 5432
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ "ALL" ]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  backend:
    url: http://host.docker.internal:4000
    # The Compose API can use a different internal token than this chart.
    # Create this Secret with INTERNAL_TOKEN in the release namespace.
    internalToken:
      existingSecret: ""
      key: INTERNAL_TOKEN
  locations:
    url: http://triplanner-locations:4300
    timeoutMs: 8000
  broker:
    url: http://triplanner-kafka:8080
    topic: LocationChanged
    consumer: agent-locations
  sync:
    intervalMs: 300000
    matchThreshold: 60
    enrichLimit: 20

  internalToken:
    existingSecret: triplanner-internal
    key: INTERNAL_TOKEN

  llm:
    provider: none
    model: ""
    baseUrl: ""
    # Optional seed for LLM_API_KEY; the app-entered key lives on the PVC.
    existingSecret: ""
    apiKeyKey: LLM_API_KEY

  persistence:
    enabled: true
    size: 64Mi
    mountPath: /app/.data
    existingClaim: ""

  serviceAccount:
    create: true
    name: ""
    automount: false
    annotations: {}

  hostAliases: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Web frontend. Next.js standalone behind nginx ingress. The API is still
# external in this slice; the agent runs in this chart.
webService:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  backend:
    url: http://host.docker.internal:4000/graphql
    origin: http://host.docker.internal:4000
  agent:
    url: http://triplanner-agent:4100
  ingress:
    enabled: true
    className: nginx
    host: triplanner.localhost
    path: /
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    tls: []
  # Optional extra /etc/hosts entries if host.docker.internal does not resolve
  # from the pod, e.g. [{ip: "192.168.65.254", hostnames: ["host.docker.internal"]}]
  hostAliases: []
  # When the optional NetworkPolicy is enabled, add the node/kubelet CIDR here
  # so liveness/readiness probes are not blocked, e.g. ["172.19.0.0/16"].
  networkPolicy:
    probeCIDRs: []
  serviceAccount:
    create: true
    name: ""
    automount: false
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}

networkPolicy:
  enabled: false

# Informational: the API deployment must receive these values when it lands.
api:
  broker:
    url: http://triplanner-kafka:8080
    topic: TripInvitation
  email:
    serviceUrl: http://triplanner-email:4200
  locations:
    serviceUrl: http://triplanner-locations:4300
    grpcUrl: triplanner-locations:50053
  trips:
    serviceUrl: http://triplanner-trips:4400
    grpcUrl: triplanner-trips:50052
  users:
    serviceUrl: http://triplanner-users:4500
    grpcUrl: triplanner-users:50051
  transports:
    users: grpc
    trips: grpc
    locations: grpc
