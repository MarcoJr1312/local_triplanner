        drop: ["ALL"]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  uploads:
    mountPath: /app/uploads
    persistence:
      enabled: true
      size: 1Gi
      storageClass: ""
      existingClaim: ""
  attachments:
    # HMAC secret for short-lived attachment URLs.
    existingSecret: ""
    key: ATTACHMENT_TOKEN_SECRET
    tokenSecret: dev-attachment-secret
  appUrl: ""
  reminderSweepMs: 30000
  backend:
    agentUrl: http://triplanner-agent:4100
    emailServiceUrl: http://triplanner-email:4200
    locationsUrl: http://triplanner-locations:4300
    locationsGrpcUrl: triplanner-locations:50053
    tripsUrl: http://triplanner-trips:4400
    tripsGrpcUrl: triplanner-trips:50052
    usersUrl: http://triplanner-users:4500
    usersGrpcUrl: triplanner-users:50051
  internalToken:
    existingSecret: triplanner-internal
    key: INTERNAL_TOKEN
  serviceAccount:
    create: true
    name: ""
    automount: false
    annotations: {}
  # Must stay ClusterRole while rbacProxy.enabled: TokenReview and
  # SubjectAccessReview are cluster-scoped and the chart adds those rules.
  rbac:
    create: true
    kind: ClusterRole
    rules: []
  # Local demo: HTTP 8443 for kubectl port-forward only. Never expose it.
  rbacProxy:
    enabled: true
    image:
      repository: quay.io/brancz/kube-rbac-proxy
      tag: v0.23.1
      pullPolicy: IfNotPresent
    port: 8443
    config:
      apiVersion: v1
      resource: services
      subresource: proxy
      name: triplanner-api
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      capabilities:
        drop: ["ALL"]
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 6
  nodeSelector: {}
  tolerations: []
  affinity: {}
# Web frontend. Next.js standalone behind a Cilium Gateway and HTTPRoute. The
# API and agent are in-cluster.
webService:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  backend:
    url: http://triplanner-api:4000/graphql
    origin: http://triplanner-api:4000
  agent:
    url: http://triplanner-agent:4100
  gateway:
    enabled: true
    className: cilium
    host: triplanner.localhost
    # Cilium Gateway host-network listener; kind maps 9080 to the host.
    port: 9080
    path: /
    annotations: {}
    httpRouteAnnotations: {}
  # Optional extra /etc/hosts entries for custom backends.
  hostAliases: []
  # When the optional NetworkPolicy is enabled, add the node/kubelet CIDR here
  # so liveness/readiness probes are not blocked, e.g. ["172.19.0.0/16"].
  networkPolicy:
    probeCIDRs: []
  serviceAccount:
    create: true
    name: ""
    automount: false
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    # Requires the Prometheus Operator CRDs from kube-prometheus-stack.
    # Keep false until the stack is installed, then enable it and set the
    # labels the operator selects (for example release: prometheus).
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  dashboards:
    # Grafana sidecar dashboards: ConfigMaps labeled grafana_dashboard=1.
    # The kube-prometheus-stack sidecar watches all namespaces by default.
    enabled: true
    folder: Triplanner
    labels: {}
networkPolicy:
  enabled: false
  # Kubelet probe source. Cilium sees these as the node/cilium_host IP, not
  # the "host" entity on this kind cluster. Set to the node and cilium_host /32
  # (the kind values do this).
  probeCIDRs: []
  # Cilium DNS proxy target. Every egress policy allows kube-dns; toFQDNs
  # rules rely on this rule for resolution.
  dns:
    namespace: kube-system
    label: kube-dns
  # Allow the future kube-prometheus-stack to scrape GET /metrics. The CNPs
  # remain disabled locally; these rules are ready for a compatible cluster.
  monitoring:
    namespace: monitoring
    podLabels: {}
  # Additional external hosts beyond the chart-derived Resend/HasData hosts.
  email:
    extraFQDNs: []
  locations:
    extraFQDNs: []
  agent:
    extraFQDNs:
      - api.openai.com
      - api.anthropic.com
      - api.deepseek.com
    # Ollama is usually host-local. Add the gateway CIDR(s) when used.
    ollamaCIDRs: []
