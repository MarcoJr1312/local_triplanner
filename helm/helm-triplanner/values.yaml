# Triplanner email pipeline — single-node recruiter profile.
# The chart deploys the Go demo broker and the email consumer.

global:
  # URL the recruiter actually opens. Used for invite links (API) and the
  # welcome email CTA.
  appUrl: http://localhost:3000

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

images:
  broker:
    name: marcojr13/triplanner-kafka
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  email:
    name: marcojr13/triplanner-email
    tag: "0.1.0"
    pullPolicy: IfNotPresent

# Go HTTP broker. Topic/offset/ack; not the Kafka wire protocol.
broker:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  persistence:
    enabled: true
    size: 1Gi
    mountPath: /data
    existingClaim: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}

emailService:
  enabled: true
  replicaCount: 1

  # Key-free demo: the service logs and drops messages until the recruiter adds
  # a Resend key in Profile -> Email delivery.
  provider: sink
  logLevel: info
  shutdownTimeoutMs: 15000

  service:
    type: ClusterIP
    port: 4200

  settingsFile: /app/.data/email.json
  persistence:
    enabled: true
    size: 1Gi
    mountPath: /app/.data
    existingClaim: ""

  internalToken:
    existingSecret: triplanner-internal
    key: INTERNAL_TOKEN

  broker:
    url: http://triplanner-kafka:8080
    topic: TripInvitation
    consumer: email-service
    dlqTopic: TripInvitation.dlq
    batchSize: 10
    waitSeconds: 20
    requestTimeoutMs: 35000
    retryDelayMs: 1000

  resend:
    from: "Triplanner <onboarding@resend.dev>"
    replyTo: ""
    endpoint: https://api.resend.com/emails
    timeoutMs: 10000
    # Optional seed/fallback. The app-entered key lives on the PVC.
    existingSecret: ""
    apiKeyKey: RESEND_API_KEY

  retry:
    maxAttempts: 5
    baseDelayMs: 500

  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

networkPolicy:
  enabled: false

# Informational: the API deployment must receive these values when it lands.
api:
  broker:
    url: http://triplanner-kafka:8080
    topic: TripInvitation
  email:
    serviceUrl: http://triplanner-email:4200
