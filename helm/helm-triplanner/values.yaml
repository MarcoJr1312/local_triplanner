# GraphQL API facade. Owns the public schema, demo auth, uploads, attachments,
# chats, interests and the internal agent routes. All domain services are
# in-cluster; the API talks to them over gRPC/HTTP.
apiService:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 4000
  postgres:
    enabled: true
    image:
      repository: postgres
      tag: "17"
      pullPolicy: IfNotPresent
    auth:
      enabled: true
      # DEMO ONLY. Rendered into triplanner-api-postgres-credentials.
      username: triplanner
      password: triplanner-demo
      database: triplanner
      existingSecret: ""
      usernameKey: POSTGRES_USER
      passwordKey: POSTGRES_PASSWORD
      databaseKey: POSTGRES_DB
      databaseUrlKey: DATABASE_URL
    service:
      port: 5432
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
