# Triplanner demo services - single-node recruiter profile.
# The chart deploys the Go demo broker, the email consumer, the locations
# catalogue and its MongoDB StatefulSet.
#
# Every manifest renders `metadata.namespace: {{ .Release.Namespace }}`.
# First create the namespace, then install with the same -n:
#   kubectl create namespace triplanner
#   helm install triplanner ./helm/helm-triplanner -n triplanner

global:
  # URL the recruiter actually opens. Used for invite links (API) and the
  # welcome email CTA.
  appUrl: http://localhost:3000

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

images:
  broker:
    name: marcojr13/triplanner-kafka
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  email:
    name: marcojr13/triplanner-email
    tag: "0.1.1"
    pullPolicy: IfNotPresent
  locations:
    name: marcojr13/triplanner-locations
    tag: "1.7.0"
    pullPolicy: IfNotPresent
  trips:
    name: marcojr13/triplanner-trips
    tag: "1.7.0"
    pullPolicy: IfNotPresent
  users:
    name: marcojr13/triplanner-users
    tag: "1.7.0"
    pullPolicy: IfNotPresent
  agent:
    name: marcojr13/triplanner-agent
    tag: "1.7.0"
    pullPolicy: IfNotPresent
  web:
    name: marcojr13/triplanner-web
    tag: "1.7.0"
    pullPolicy: IfNotPresent

# MongoDB 7 StatefulSet for the locations catalogue. Single node, no auth:
# the Service is ClusterIP-only and the NetworkPolicy limits ingress.
mongo:
  enabled: true
  replicaCount: 1
  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    # DEMO ONLY. These values are rendered into a Kubernetes Secret so the
    # demo remains self-contained. In production, set existingSecret to a
    # Secret managed by HashiCorp Vault, External Secrets, Sealed Secrets or
    # your platform's secret manager. Never commit real credentials here.
    username: triplanner
    password: triplanner-demo
    existingSecret: ""
    usernameKey: MONGO_ROOT_USERNAME
    passwordKey: MONGO_ROOT_PASSWORD
  service:
    port: 27017
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Go HTTP broker. Topic/offset/ack; not the Kafka wire protocol.
broker:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  persistence:
    enabled: true
    size: 1Gi
    mountPath: /data
    existingClaim: ""
  serviceAccount:
    create: true
    name: ""
    automount: false
    annotations: {}
  # Must stay ClusterRole while rbacProxy.enabled: TokenReview and
  # SubjectAccessReview are cluster-scoped and the chart adds those rules.
  # Add any extra service rules here.
  rbac:
    create: true
    kind: ClusterRole
    rules: []
  # Local demo: HTTP 8443 for kubectl port-forward only. Never expose it.
  rbacProxy:
    enabled: true
    image:
      repository: quay.io/brancz/kube-rbac-proxy
      tag: v0.23.1
      pullPolicy: IfNotPresent
    port: 8443
    config:
      apiVersion: v1
      resource: services
      subresource: proxy
      name: triplanner-kafka
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      capabilities:
        drop: [ "ALL" ]
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Email service configuration values.
emailService:
  enabled: true
  replicaCount: 1

  # Key-free demo: the service logs and drops messages until the recruiter adds
  # a Resend key in Profile -> Email delivery.
  provider: sink
  logLevel: info
  shutdownTimeoutMs: 15000

  service:
    type: ClusterIP
    port: 4200

  settingsFile: /app/.data/email.json
  persistence:
    enabled: true
    size: 1Gi
    mountPath: /app/.data
    existingClaim: ""

  internalToken:
    existingSecret: triplanner-internal
    key: INTERNAL_TOKEN
  serviceAccount:
    create: true
    name: ""
    automount: false
    annotations: {}
  # Must stay ClusterRole while rbacProxy.enabled: TokenReview and
  # SubjectAccessReview are cluster-scoped and the chart adds those rules.
  # Add any extra service rules here.
  rbac:
    create: true
    kind: ClusterRole
    rules: []
  # Local demo: HTTP 8443 for kubectl port-forward only. Never expose it.
  rbacProxy:
    enabled: true
    image:
      repository: quay.io/brancz/kube-rbac-proxy
      tag: v0.23.1
      pullPolicy: IfNotPresent
    port: 8443
    config:
      apiVersion: v1
      resource: services
      subresource: proxy
      name: triplanner-email
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      capabilities:
        drop: [ "ALL" ]

  broker:
    url: http://triplanner-kafka:8080
    topic: TripInvitation
    consumer: email-service
    dlqTopic: TripInvitation.dlq
    batchSize: 10
    waitSeconds: 20
    requestTimeoutMs: 35000
    retryDelayMs: 1000

  resend:
    from: "Triplanner <onboarding@resend.dev>"
    replyTo: ""
    endpoint: https://api.resend.com/emails
    timeoutMs: 10000
    # Optional seed/fallback. The app-entered key lives on the PVC.
    existingSecret: ""
    apiKeyKey: RESEND_API_KEY

  retry:
    maxAttempts: 5
    baseDelayMs: 500

  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Locations/activities catalogue. The only MongoDB owner in the chart.
locationsService:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 4300
    grpcPort: 50053
  mongo:
    # Optional full URL override; normally leave empty and use host/database
    # plus the Secret-backed MONGODB_USERNAME/MONGODB_PASSWORD.
    url: ""
    host: triplanner-mongo:27017
    database: triplanner
    authSource: admin
    collection: locations
  seed:
    enabled: true
    dataPath: /app/db/toronto-locations.json
  settingsFile: /app/.data/locations.json
  persistence:
    enabled: true
    size: 64Mi
    mountPath: /app/.data
    existingClaim: ""
  hasdata:
    apiBase: https://api.hasdata.com/scrape/google-maps
    # Cached HasData rows expire after 5 days (Mongo TTL index).
    cacheTtlHours: 120
    timeoutMs: 8000
    hl: en
    gl: ca
  broker:
    url: http://triplanner-kafka:8080
    topic: LocationChanged
  outbox:
    intervalMs: 1000
    batchSize: 50
  internalToken:
    existingSecret: triplanner-internal
    key: INTERNAL_TOKEN
  serviceAccount:
    create: true
    name: ""
    automount: false
    annotations: {}
  # Must stay ClusterRole while rbacProxy.enabled: TokenReview and
  # SubjectAccessReview are cluster-scoped and the chart adds those rules.
  # Add any extra service rules here.
  rbac:
    create: true
    kind: ClusterRole
    rules: []
  # Local demo: HTTP 8443 for kubectl port-forward only. Never expose it.
  rbacProxy:
    enabled: true
    image:
      repository: quay.io/brancz/kube-rbac-proxy
      tag: v0.23.1
      pullPolicy: IfNotPresent
    port: 8443
    config:
      apiVersion: v1
      resource: services
      subresource: proxy
      name: triplanner-locations
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      capabilities:
        drop: [ "ALL" ]
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}

