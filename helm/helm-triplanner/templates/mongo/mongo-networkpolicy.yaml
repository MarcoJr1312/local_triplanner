{{- if and .Values.mongo.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triplanner-mongo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-mongo
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mongo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: triplanner-mongo
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-locations
      ports:
        - port: {{ .Values.mongo.service.port }}
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
