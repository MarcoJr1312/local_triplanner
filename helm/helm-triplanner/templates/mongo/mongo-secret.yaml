{{- if and .Values.mongo.enabled .Values.mongo.auth.enabled (not .Values.mongo.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helm-triplanner.mongoSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-mongo
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mongo
type: Opaque
data:
  {{ .Values.mongo.auth.usernameKey }}: {{ .Values.mongo.auth.username | b64enc | quote }}
  {{ .Values.mongo.auth.passwordKey }}: {{ .Values.mongo.auth.password | b64enc | quote }}
{{- end }}
