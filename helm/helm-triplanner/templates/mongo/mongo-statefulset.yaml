{{- if .Values.mongo.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: triplanner-mongo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-mongo
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mongo
spec:
  serviceName: triplanner-mongo
  replicas: {{ .Values.mongo.replicaCount | default 1 }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: triplanner-mongo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triplanner-mongo
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mongo
        {{- with .Values.mongo.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.mongo.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.mongo.podSecurityContext | nindent 8 }}
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: mongodb
              containerPort: {{ .Values.mongo.service.port }}
              protocol: TCP
          {{- if .Values.mongo.auth.enabled }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.mongoSecretName" . }}
                  key: {{ .Values.mongo.auth.usernameKey }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.mongoSecretName" . }}
                  key: {{ .Values.mongo.auth.passwordKey }}
            - name: MONGO_INITDB_DATABASE
              value: {{ .Values.locationsService.mongo.database | quote }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.mongo.securityContext | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.mongo.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.mongo.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mongo.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mongo.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.mongo.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: triplanner-mongo
          app.kubernetes.io/instance: {{ .Release.Name }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.mongo.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongo.persistence.size }}
  {{- end }}
{{- end }}
