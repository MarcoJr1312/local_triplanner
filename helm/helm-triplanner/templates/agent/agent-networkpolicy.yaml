{{- if and .Values.agentService.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triplanner-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: triplanner-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-web
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.agentService.service.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-agent-postgres
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.agentService.postgres.service.port }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-locations
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.locationsService.service.port }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-kafka
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.broker.service.port }}
          protocol: TCP
    # Compose API on the Docker Desktop host until the API joins Helm.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 4000
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
