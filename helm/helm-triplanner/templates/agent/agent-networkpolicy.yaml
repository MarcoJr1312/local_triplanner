{{- if and .Values.agentService.enabled .Values.networkPolicy.enabled }}
{{- $llmHost := "" }}
{{- if .Values.agentService.llm.baseUrl }}
{{- $llmHost = (urlParse .Values.agentService.llm.baseUrl).host }}
{{- end }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: triplanner-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      k8s:app.kubernetes.io/name: triplanner-agent
      k8s:app.kubernetes.io/instance: {{ .Release.Name }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            k8s:app.kubernetes.io/name: triplanner-web
            k8s:app.kubernetes.io/instance: {{ .Release.Name }}
      toPorts:
        - ports:
            - port: "{{ .Values.agentService.service.port }}"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "{{ .Values.agentService.service.port }}"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            k8s:app.kubernetes.io/name: {{ .Chart.Name }}
            k8s:app.kubernetes.io/instance: {{ .Release.Name }}
      toPorts:
        - ports:
            - port: "{{ .Values.agentService.service.port }}"
              protocol: TCP
    {{ with .Values.networkPolicy.probeCIDRs }}
    - fromCIDR:
        {{ range . }}
        - {{ . | quote }}
        {{ end }}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "4100"
              protocol: TCP
            - port: "4200"
              protocol: TCP
            - port: "4300"
              protocol: TCP
            - port: "4400"
              protocol: TCP
            - port: "4500"
              protocol: TCP
            - port: "50051"
              protocol: TCP
            - port: "50052"
              protocol: TCP
            - port: "50053"
              protocol: TCP
            - port: "5432"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "27017"
              protocol: TCP
    {{ end }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            k8s:app.kubernetes.io/name: triplanner-agent-postgres
            k8s:app.kubernetes.io/instance: {{ .Release.Name }}
      toPorts:
        - ports:
            - port: "{{ .Values.agentService.postgres.service.port }}"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            k8s:app.kubernetes.io/name: triplanner-locations
            k8s:app.kubernetes.io/instance: {{ .Release.Name }}
      toPorts:
        - ports:
            - port: "{{ .Values.locationsService.service.port }}"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            k8s:app.kubernetes.io/name: triplanner-kafka
            k8s:app.kubernetes.io/instance: {{ .Release.Name }}
      toPorts:
        - ports:
            - port: "{{ .Values.broker.service.port }}"
              protocol: TCP
    # The Compose API through triplanner-host-proxy.
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "{{ .Values.webService.backendProxy.port | default 4000 }}"
              protocol: TCP
    {{- if $llmHost }}
    - toFQDNs:
        - matchName: {{ $llmHost | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- range .Values.networkPolicy.agent.extraFQDNs }}
    - toFQDNs:
        - matchName: {{ . | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.agent.ollamaCIDRs }}
    - toCIDR:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
    {{- end }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.dns.namespace }}
            k8s:k8s-app: {{ .Values.networkPolicy.dns.label }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
{{- end }}
