{{- if and .Values.agentService.enabled .Values.agentService.postgres.enabled .Values.agentService.postgres.auth.enabled (not .Values.agentService.postgres.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helm-triplanner.agentPostgresSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-agent-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent-postgres
type: Opaque
data:
  {{ .Values.agentService.postgres.auth.usernameKey }}: {{ .Values.agentService.postgres.auth.username | b64enc | quote }}
  {{ .Values.agentService.postgres.auth.passwordKey }}: {{ .Values.agentService.postgres.auth.password | b64enc | quote }}
  {{ .Values.agentService.postgres.auth.databaseKey }}: {{ .Values.agentService.postgres.auth.database | b64enc | quote }}
{{- end }}
