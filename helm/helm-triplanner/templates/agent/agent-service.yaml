{{- if .Values.agentService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: triplanner-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent
spec:
  type: {{ .Values.agentService.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: triplanner-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.agentService.service.port }}
      targetPort: http
{{- end }}
