{{- if and .Values.agentService.enabled .Values.agentService.postgres.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triplanner-agent-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-agent-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: triplanner-agent-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-agent
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.agentService.postgres.service.port }}
          protocol: TCP
{{- end }}
