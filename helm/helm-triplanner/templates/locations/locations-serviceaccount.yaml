{{- if and .Values.locationsService.enabled .Values.locationsService.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helm-triplanner.locationsServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-locations
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: locations
  {{- with .Values.locationsService.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.locationsService.serviceAccount.automount }}
{{- end }}
