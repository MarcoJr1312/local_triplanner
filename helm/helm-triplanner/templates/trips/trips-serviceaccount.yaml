{{- if and .Values.tripsService.enabled .Values.tripsService.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helm-triplanner.tripsServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-trips
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: trips
  {{- with .Values.tripsService.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.tripsService.serviceAccount.automount }}
{{- end }}
