{{- if and .Values.usersService.enabled .Values.usersService.postgres.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triplanner-users-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-users-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: users-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: triplanner-users-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-users
      ports:
        - port: {{ .Values.usersService.postgres.service.port }}
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
