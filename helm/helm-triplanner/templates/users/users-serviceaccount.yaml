{{- if and .Values.usersService.enabled .Values.usersService.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helm-triplanner.usersServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-users
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: users
  {{- with .Values.usersService.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.usersService.serviceAccount.automount }}
{{- end }}
