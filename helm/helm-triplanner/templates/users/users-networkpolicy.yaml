{{- if and .Values.usersService.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triplanner-users
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-users
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: users
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: triplanner-users
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-api
      ports:
        - port: {{ .Values.usersService.service.port }}
          protocol: TCP
        - port: {{ .Values.usersService.service.grpcPort }}
          protocol: TCP
    {{- if .Values.usersService.rbacProxy.enabled }}
    - ports:
        - port: {{ .Values.usersService.rbacProxy.port }}
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-users-postgres
      ports:
        - port: {{ .Values.usersService.postgres.service.port }}
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
