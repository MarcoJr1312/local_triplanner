{{- if .Values.webService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triplanner-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-web
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.webService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: triplanner-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triplanner-web
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
        {{- with .Values.webService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.webService.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "helm-triplanner.webServiceAccountName" . }}
      automountServiceAccountToken: {{ .Values.webService.serviceAccount.automount }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webService.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.webService.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.images.web.name }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.webService.service.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.webService.service.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: NEXT_PRIVATE_BACKEND_URL
              value: {{ .Values.webService.backend.url | quote }}
            - name: NEXT_PRIVATE_BACKEND_ORIGIN
              value: {{ .Values.webService.backend.origin | quote }}
            - name: NEXT_PRIVATE_AGENT_URL
              value: {{ .Values.webService.agent.url | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          livenessProbe:
            {{- toYaml .Values.webService.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.webService.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.webService.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.webService.securityContext | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      {{- with .Values.webService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
