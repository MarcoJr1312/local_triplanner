{{- if .Values.webService.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "helm-triplanner.fullname" . }}-web-test"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-triplanner.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget", "-qO-", "http://triplanner-web:{{ .Values.webService.service.port }}/api/health"]
  restartPolicy: Never
{{- end }}
