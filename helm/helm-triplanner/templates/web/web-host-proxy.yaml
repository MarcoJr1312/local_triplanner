{{- if and .Values.webService.enabled .Values.webService.backendProxy.enabled }}
{{- $proxy := .Values.webService.backendProxy }}
{{- $port := $proxy.port | default 4000 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triplanner-host-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-host-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triplanner-host-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triplanner-host-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      # Transitional: the API is still a Compose workload. The host-network
      # proxy is the only pod that talks to the Docker Desktop host.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: socat
          image: "{{ $proxy.image.repository }}:{{ $proxy.image.tag }}"
          imagePullPolicy: {{ $proxy.image.pullPolicy | default "IfNotPresent" }}
          args:
            - "TCP-LISTEN:{{ $port }},fork,reuseaddr"
            - "TCP:{{ $proxy.targetHost }}:{{ $port }}"
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          resources:
            {{- toYaml $proxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: triplanner-host-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-host-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: triplanner-host-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- end }}
