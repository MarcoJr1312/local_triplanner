{{- if and .Values.webService.enabled .Values.webService.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: triplanner-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-web
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  {{- with .Values.webService.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.webService.ingress.className | default "nginx" }}
  {{- with .Values.webService.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.webService.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.webService.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: triplanner-web
                port:
                  number: {{ .Values.webService.service.port }}
{{- end }}
