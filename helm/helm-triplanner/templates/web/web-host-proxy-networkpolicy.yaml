{{- if and .Values.webService.enabled .Values.webService.backendProxy.enabled .Values.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: triplanner-host-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-host-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      k8s:app.kubernetes.io/name: triplanner-host-proxy
      k8s:app.kubernetes.io/instance: {{ .Release.Name }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            k8s:app.kubernetes.io/name: triplanner-web
            k8s:app.kubernetes.io/instance: {{ .Release.Name }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            k8s:app.kubernetes.io/name: triplanner-agent
            k8s:app.kubernetes.io/instance: {{ .Release.Name }}
      toPorts:
        - ports:
            - port: "{{ .Values.webService.backendProxy.port | default 4000 }}"
              protocol: TCP
    {{ with .Values.networkPolicy.probeCIDRs }}
    - fromCIDR:
        {{ range . }}
        - {{ . | quote }}
        {{ end }}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "4100"
              protocol: TCP
            - port: "4200"
              protocol: TCP
            - port: "4300"
              protocol: TCP
            - port: "4400"
              protocol: TCP
            - port: "4500"
              protocol: TCP
            - port: "50051"
              protocol: TCP
            - port: "50052"
              protocol: TCP
            - port: "50053"
              protocol: TCP
            - port: "5432"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "27017"
              protocol: TCP
    {{ end }}
  egress:
    - toCIDR:
        - {{ printf "%s/32" .Values.webService.backendProxy.targetHost | quote }}
      toPorts:
        - ports:
            - port: "{{ .Values.webService.backendProxy.port | default 4000 }}"
              protocol: TCP
{{- end }}
