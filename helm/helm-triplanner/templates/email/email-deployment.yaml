{{- if .Values.emailService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triplanner-email
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-email
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: email
spec:
  replicas: {{ .Values.emailService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: triplanner-email
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triplanner-email
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: email
        {{- with .Values.emailService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/email/email-configmap.yaml") . | sha256sum }}
        {{- with .Values.emailService.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "helm-triplanner.emailServiceAccountName" . }}
      automountServiceAccountToken: {{ if .Values.emailService.rbacProxy.enabled }}true{{ else }}{{ .Values.emailService.serviceAccount.automount }}{{ end }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.emailService.podSecurityContext | nindent 8 }}
      containers:
        - name: email
          image: "{{ required "images.email.name is required" .Values.images.email.name }}:{{ required "images.email.tag is required" .Values.images.email.tag }}"
          imagePullPolicy: {{ .Values.images.email.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.emailService.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: triplanner-email-config
          env:
            {{- if .Values.emailService.resend.existingSecret }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emailService.resend.existingSecret }}
                  key: {{ .Values.emailService.resend.apiKeyKey }}
            {{- end }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "emailService.internalToken.existingSecret is required" .Values.emailService.internalToken.existingSecret }}
                  key: {{ .Values.emailService.internalToken.key }}
          volumeMounts:
            - name: email-settings
              mountPath: {{ .Values.emailService.persistence.mountPath | default "/app/.data" }}
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            {{- toYaml .Values.emailService.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.emailService.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.emailService.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.emailService.securityContext | nindent 12 }}
        {{- if .Values.emailService.rbacProxy.enabled }}
        - name: kube-rbac-proxy
          image: "{{ .Values.emailService.rbacProxy.image.repository }}:{{ .Values.emailService.rbacProxy.image.tag }}"
          imagePullPolicy: {{ .Values.emailService.rbacProxy.image.pullPolicy | default "IfNotPresent" }}
          args:
            - --insecure-listen-address=0.0.0.0:{{ .Values.emailService.rbacProxy.port }}
            - --upstream=http://127.0.0.1:{{ .Values.emailService.service.port }}/
            - --config-file=/etc/kube-rbac-proxy/config-file.yaml
          ports:
            - name: rbac-proxy
              containerPort: {{ .Values.emailService.rbacProxy.port }}
              protocol: TCP
          volumeMounts:
            - name: rbac-proxy-config
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: rbac-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: rbac-proxy
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.emailService.rbacProxy.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.emailService.rbacProxy.securityContext | nindent 12 }}
        {{- end }}
      volumes:
        - name: email-settings
          {{- if .Values.emailService.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.emailService.persistence.existingClaim | default "triplanner-email-settings" }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.emailService.rbacProxy.enabled }}
        - name: rbac-proxy-config
          configMap:
            name: triplanner-email-rbac-proxy
        {{- end }}
      {{- with .Values.emailService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.emailService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.emailService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
