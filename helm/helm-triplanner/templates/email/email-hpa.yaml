{{- if and .Values.emailService.enabled .Values.emailService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: triplanner-email
  labels:
    app.kubernetes.io/name: triplanner-email
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: triplanner-email
  minReplicas: {{ .Values.emailService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.emailService.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.emailService.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.emailService.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
