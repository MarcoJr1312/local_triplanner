{{- if .Values.emailService.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "helm-triplanner.fullname" . }}-email-test"
  labels:
    {{- include "helm-triplanner.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget", "-qO-", "http://triplanner-email:{{ .Values.emailService.service.port }}/health"]
  restartPolicy: Never
{{- end }}
