{{- if .Values.networkPolicy.enabled }}
{{- $exporters := list
  (dict "name" "triplanner-postgres-users" "exporter" "prometheus-postgres-exporter" "database" "triplanner-users-postgres" "dbPort" 5432 "exporterPort" 9187)
  (dict "name" "triplanner-postgres-trips" "exporter" "prometheus-postgres-exporter" "database" "triplanner-trips-postgres" "dbPort" 5432 "exporterPort" 9187)
  (dict "name" "triplanner-postgres-api" "exporter" "prometheus-postgres-exporter" "database" "triplanner-api-postgres" "dbPort" 5432 "exporterPort" 9187)
  (dict "name" "triplanner-postgres-agent" "exporter" "prometheus-postgres-exporter" "database" "triplanner-agent-postgres" "dbPort" 5432 "exporterPort" 9187)
  (dict "name" "triplanner-mongodb" "exporter" "prometheus-mongodb-exporter" "database" "triplanner-mongo" "dbPort" 27017 "exporterPort" 9216)
}}
{{- range $exporter := $exporters }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $exporter.name }}-exporter
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $exporter.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: monitoring
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }}
      k8s:app.kubernetes.io/name: {{ $exporter.exporter }}
      k8s:app.kubernetes.io/instance: {{ $exporter.name }}
  ingress:
    {{- include "helm-triplanner.monitoringIngress" (dict "root" $ "port" $exporter.exporterPort) | nindent 4 }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }}
            k8s:app.kubernetes.io/name: {{ $exporter.database }}
            k8s:app.kubernetes.io/instance: {{ $.Release.Name }}
      toPorts:
        - ports:
            - port: "{{ $exporter.dbPort }}"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Values.networkPolicy.dns.namespace }}
            k8s:k8s-app: {{ $.Values.networkPolicy.dns.label }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $exporter.database }}-exporter-ingress
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $exporter.database }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: monitoring
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }}
      k8s:app.kubernetes.io/name: {{ $exporter.database }}
      k8s:app.kubernetes.io/instance: {{ $.Release.Name }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }}
            k8s:app.kubernetes.io/name: {{ $exporter.exporter }}
            k8s:app.kubernetes.io/instance: {{ $exporter.name }}
      toPorts:
        - ports:
            - port: "{{ $exporter.dbPort }}"
              protocol: TCP
{{- end }}
{{- end }}
