{{- if and .Values.broker.enabled .Values.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: triplanner-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      k8s:app.kubernetes.io/name: triplanner-kafka
      k8s:app.kubernetes.io/instance: {{ .Release.Name }}
  ingress:
    {{- include "helm-triplanner.monitoringIngress" (dict "root" . "port" .Values.broker.service.port) | nindent 4 }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            k8s:app.kubernetes.io/name: triplanner-email
            k8s:app.kubernetes.io/instance: {{ .Release.Name }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            k8s:app.kubernetes.io/name: triplanner-api
      toPorts:
        - ports:
            - port: "{{ .Values.broker.service.port }}"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "{{ .Values.broker.service.port }}"
              protocol: TCP
    {{- if .Values.broker.rbacProxy.enabled }}
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "{{ .Values.broker.rbacProxy.port }}"
              protocol: TCP
    {{- end }}
    {{ with .Values.networkPolicy.probeCIDRs }}
    - fromCIDR:
        {{ range . }}
        - {{ . | quote }}
        {{ end }}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "4100"
              protocol: TCP
            - port: "4200"
              protocol: TCP
            - port: "4300"
              protocol: TCP
            - port: "4400"
              protocol: TCP
            - port: "4500"
              protocol: TCP
            - port: "50051"
              protocol: TCP
            - port: "50052"
              protocol: TCP
            - port: "50053"
              protocol: TCP
            - port: "5432"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "27017"
              protocol: TCP
    {{ end }}
  egress:
    {{- if .Values.broker.rbacProxy.enabled }}
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.dns.namespace }}
            k8s:k8s-app: {{ .Values.networkPolicy.dns.label }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
{{- end }}
