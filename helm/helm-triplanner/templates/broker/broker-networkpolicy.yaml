{{- if and .Values.broker.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triplanner-kafka
  labels:
    app.kubernetes.io/name: triplanner-kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: triplanner-kafka
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-email
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-api
      ports:
        - port: {{ .Values.broker.service.port }}
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
