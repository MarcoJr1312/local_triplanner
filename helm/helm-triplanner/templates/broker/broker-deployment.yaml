{{- if .Values.broker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triplanner-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: broker
spec:
  replicas: {{ .Values.broker.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: triplanner-kafka
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triplanner-kafka
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: broker
        {{- with .Values.broker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.broker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "helm-triplanner.brokerServiceAccountName" . }}
      automountServiceAccountToken: {{ .Values.broker.serviceAccount.automount }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.broker.podSecurityContext | nindent 8 }}
      containers:
        - name: broker
          image: "{{ required "images.broker.name is required" .Values.images.broker.name }}:{{ required "images.broker.tag is required" .Values.images.broker.tag }}"
          imagePullPolicy: {{ .Values.images.broker.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.broker.service.port }}
              protocol: TCP
          env:
            - name: BROKER_ADDR
              value: ":{{ .Values.broker.service.port }}"
            - name: BROKER_DB
              value: "{{ .Values.broker.persistence.mountPath | default "/data" }}/broker.db"
          volumeMounts:
            - name: broker-data
              mountPath: {{ .Values.broker.persistence.mountPath | default "/data" }}
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            {{- toYaml .Values.broker.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.broker.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.broker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.broker.securityContext | nindent 12 }}
      volumes:
        - name: broker-data
          {{- if .Values.broker.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.broker.persistence.existingClaim | default "triplanner-kafka-data" }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.broker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.broker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.broker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
