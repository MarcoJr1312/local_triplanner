{{- if and .Values.broker.enabled .Values.broker.rbac.create }}
{{- $name := include "helm-triplanner.brokerServiceAccountName" . }}
{{- if eq .Values.broker.rbac.kind "ClusterRole" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: triplanner-kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: broker
rules:
  {{- toYaml .Values.broker.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: broker
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: broker
rules:
  {{- toYaml .Values.broker.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: broker
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
{{- end }}
