{{- if and .Values.apiService.enabled .Values.apiService.rbac.create }}
{{- if and .Values.apiService.rbacProxy.enabled (ne .Values.apiService.rbac.kind "ClusterRole") }}
{{- fail "apiService.rbac.kind must be ClusterRole when apiService.rbacProxy.enabled" }}
{{- end }}
{{- $name := include "helm-triplanner.apiServiceAccountName" . }}
{{- if eq .Values.apiService.rbac.kind "ClusterRole" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: triplanner-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
rules:
{{- if .Values.apiService.rbacProxy.enabled }}
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
{{- end }}
{{- with .Values.apiService.rbac.rules }}
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: triplanner-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
rules:
{{- if .Values.apiService.rbacProxy.enabled }}
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
{{- end }}
{{- with .Values.apiService.rbac.rules }}
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
{{- end }}
