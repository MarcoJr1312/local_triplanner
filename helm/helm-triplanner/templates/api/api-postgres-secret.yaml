{{- if and .Values.apiService.enabled .Values.apiService.postgres.enabled .Values.apiService.postgres.auth.enabled (not .Values.apiService.postgres.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helm-triplanner.apiPostgresSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-api-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-postgres
type: Opaque
data:
  {{ .Values.apiService.postgres.auth.usernameKey }}: {{ .Values.apiService.postgres.auth.username | b64enc | quote }}
  {{ .Values.apiService.postgres.auth.passwordKey }}: {{ .Values.apiService.postgres.auth.password | b64enc | quote }}
  {{ .Values.apiService.postgres.auth.databaseKey }}: {{ .Values.apiService.postgres.auth.database | b64enc | quote }}
  {{ .Values.apiService.postgres.auth.databaseUrlKey }}: {{ printf "postgres://%s:%s@triplanner-api-postgres:%v/%s" .Values.apiService.postgres.auth.username .Values.apiService.postgres.auth.password .Values.apiService.postgres.service.port .Values.apiService.postgres.auth.database | b64enc | quote }}
{{- end }}
