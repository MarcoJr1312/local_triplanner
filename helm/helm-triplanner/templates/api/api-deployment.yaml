{{- if .Values.apiService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triplanner-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.apiService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: triplanner-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triplanner-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
        {{- with .Values.apiService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api/api-configmap.yaml") . | sha256sum }}
        {{- with .Values.apiService.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "helm-triplanner.apiServiceAccountName" . }}
      automountServiceAccountToken: {{ .Values.apiService.serviceAccount.automount }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.apiService.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.apiService.postgres.image.repository }}:{{ .Values.apiService.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.apiService.postgres.image.pullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - 'until pg_isready -h triplanner-api-postgres -p {{ .Values.apiService.postgres.service.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done'
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.apiPostgresSecretName" . }}
                  key: {{ .Values.apiService.postgres.auth.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.apiPostgresSecretName" . }}
                  key: {{ .Values.apiService.postgres.auth.passwordKey }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.apiPostgresSecretName" . }}
                  key: {{ .Values.apiService.postgres.auth.databaseKey }}
          securityContext:
            {{- toYaml .Values.apiService.securityContext | nindent 12 }}
        - name: migrate
          image: "{{ .Values.images.api.name }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - 'bun run db:migrate && bun run db:seed'
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.apiPostgresSecretName" . }}
                  key: {{ .Values.apiService.postgres.auth.databaseUrlKey }}
            - name: TRIPLANNER_UPLOADS_OVERRIDE
              value: {{ .Values.apiService.uploads.mountPath | quote }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.apiService.uploads.mountPath }}
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.apiService.securityContext | nindent 12 }}
      containers:
        - name: api
          image: "{{ .Values.images.api.name }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.apiService.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: triplanner-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.apiPostgresSecretName" . }}
                  key: {{ .Values.apiService.postgres.auth.databaseUrlKey }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiService.internalToken.existingSecret }}
                  key: {{ .Values.apiService.internalToken.key }}
            - name: ATTACHMENT_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.apiAttachmentSecretName" . }}
                  key: {{ .Values.apiService.attachments.key }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.apiService.uploads.mountPath }}
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            {{- toYaml .Values.apiService.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.apiService.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.apiService.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.apiService.securityContext | nindent 12 }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "helm-triplanner.apiUploadsClaimName" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.apiService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
