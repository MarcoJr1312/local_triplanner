{{- if and .Values.apiService.enabled .Values.apiService.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: triplanner-api-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-api-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-postgres
spec:
  serviceName: triplanner-api-postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: triplanner-api-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triplanner-api-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.apiService.postgres.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.apiService.postgres.image.repository }}:{{ .Values.apiService.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.apiService.postgres.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: postgres
              containerPort: {{ .Values.apiService.postgres.service.port }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.apiPostgresSecretName" . }}
                  key: {{ .Values.apiService.postgres.auth.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.apiPostgresSecretName" . }}
                  key: {{ .Values.apiService.postgres.auth.passwordKey }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-triplanner.apiPostgresSecretName" . }}
                  key: {{ .Values.apiService.postgres.auth.databaseKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.apiService.postgres.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.apiService.postgres.securityContext | nindent 12 }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.apiService.postgres.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.apiService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.apiService.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: triplanner-api-postgres
          app.kubernetes.io/instance: {{ .Release.Name }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.apiService.postgres.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.apiService.postgres.persistence.size }}
  {{- end }}
{{- end }}
