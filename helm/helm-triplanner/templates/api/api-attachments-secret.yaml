{{- if and .Values.apiService.enabled (not .Values.apiService.attachments.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helm-triplanner.apiAttachmentSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
type: Opaque
data:
  {{ .Values.apiService.attachments.key }}: {{ .Values.apiService.attachments.tokenSecret | b64enc | quote }}
{{- end }}
