{{- if .Values.apiService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: triplanner-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: triplanner-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.apiService.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: triplanner-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.apiService.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
