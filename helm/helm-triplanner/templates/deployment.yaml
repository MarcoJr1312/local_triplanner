{{- if .Values.emailService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triplanner-email
  labels:
    app.kubernetes.io/name: triplanner-email
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: email
spec:
  replicas: {{ .Values.emailService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: triplanner-email
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triplanner-email
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: email
        {{- with .Values.emailService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.emailService.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "helm-triplanner.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.emailService.podSecurityContext | nindent 8 }}
      containers:
        - name: email
          image: "{{ required "images.email.name is required" .Values.images.email.name }}:{{ required "images.email.tag is required" .Values.images.email.tag }}"
          imagePullPolicy: {{ .Values.images.email.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.emailService.service.port }}
              protocol: TCP
          env:
            - name: HEALTH_PORT
              value: {{ .Values.emailService.service.port | quote }}
            - name: KAFKA_BROKERS
              value: {{ required "kafka.brokers must contain at least one broker" (join "," .Values.kafka.brokers) | quote }}
            - name: KAFKA_CLIENT_ID
              value: {{ .Values.emailService.kafka.clientId | quote }}
            - name: KAFKA_GROUP_ID
              value: {{ .Values.emailService.kafka.groupId | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.emailService.kafka.topic | quote }}
            - name: KAFKA_DLQ_TOPIC
              value: {{ .Values.emailService.kafka.dlqTopic | quote }}
            - name: KAFKA_ENSURE_TOPICS
              value: {{ .Values.emailService.kafka.ensureTopics | quote }}
            - name: KAFKA_PARTITIONS
              value: {{ .Values.emailService.kafka.partitions | quote }}
            - name: KAFKA_REPLICATION_FACTOR
              value: {{ .Values.emailService.kafka.replicationFactor | quote }}
            - name: KAFKA_CONCURRENCY
              value: {{ .Values.emailService.kafka.concurrency | quote }}
            - name: KAFKA_CONNECTION_TIMEOUT_MS
              value: {{ .Values.emailService.kafka.connectionTimeoutMs | quote }}
            - name: KAFKA_REQUEST_TIMEOUT_MS
              value: {{ .Values.emailService.kafka.requestTimeoutMs | quote }}
            - name: KAFKA_SSL
              value: {{ .Values.kafka.tls.enabled | quote }}
            {{- if .Values.kafka.tls.enabled }}
            - name: KAFKA_SSL_CA_PATH
              value: "{{ .Values.kafka.tls.mountPath }}/{{ .Values.kafka.tls.caKey }}"
            - name: KAFKA_SSL_REJECT_UNAUTHORIZED
              value: {{ .Values.kafka.tls.rejectUnauthorized | quote }}
            {{- end }}
            {{- if .Values.kafka.sasl.enabled }}
            - name: KAFKA_SASL_MECHANISM
              value: {{ .Values.kafka.sasl.mechanism | quote }}
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "kafka.sasl.existingSecret is required when SASL is enabled" .Values.kafka.sasl.existingSecret }}
                  key: {{ .Values.kafka.sasl.usernameKey }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "kafka.sasl.existingSecret is required when SASL is enabled" .Values.kafka.sasl.existingSecret }}
                  key: {{ .Values.kafka.sasl.passwordKey }}
            {{- end }}
            - name: EMAIL_PROVIDER
              value: {{ .Values.emailService.provider | quote }}
            - name: EMAIL_SETTINGS_FILE
              value: {{ .Values.emailService.settingsFile | quote }}
            - name: EMAIL_MAX_ATTEMPTS
              value: {{ .Values.emailService.retry.maxAttempts | quote }}
            - name: EMAIL_RETRY_BASE_MS
              value: {{ .Values.emailService.retry.baseDelayMs | quote }}
            - name: RESEND_FROM
              value: {{ .Values.emailService.resend.from | quote }}
            - name: RESEND_REPLY_TO
              value: {{ .Values.emailService.resend.replyTo | quote }}
            - name: RESEND_ENDPOINT
              value: {{ .Values.emailService.resend.endpoint | quote }}
            - name: RESEND_TIMEOUT_MS
              value: {{ .Values.emailService.resend.timeoutMs | quote }}
            {{- if .Values.emailService.resend.existingSecret }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emailService.resend.existingSecret }}
                  key: {{ .Values.emailService.resend.apiKeyKey }}
            {{- end }}
            - name: APP_URL
              value: {{ .Values.global.appUrl | quote }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "emailService.internalToken.existingSecret is required" .Values.emailService.internalToken.existingSecret }}
                  key: {{ .Values.emailService.internalToken.key }}
            - name: LOG_LEVEL
              value: {{ .Values.emailService.logLevel | quote }}
            - name: SHUTDOWN_TIMEOUT_MS
              value: {{ .Values.emailService.shutdownTimeoutMs | quote }}
          volumeMounts:
            - name: email-settings
              mountPath: {{ .Values.emailService.persistence.mountPath | default "/app/.data" }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.kafka.tls.enabled }}
            - name: kafka-ca
              mountPath: {{ .Values.kafka.tls.mountPath }}
              readOnly: true
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.emailService.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.emailService.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.emailService.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.emailService.securityContext | nindent 12 }}
      volumes:
        - name: email-settings
          {{- if .Values.emailService.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.emailService.persistence.existingClaim | default "triplanner-email-settings" }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.kafka.tls.enabled }}
        - name: kafka-ca
          secret:
            secretName: {{ required "kafka.tls.existingSecret is required when TLS is enabled" .Values.kafka.tls.existingSecret }}
            items:
              - key: {{ .Values.kafka.tls.caKey }}
                path: {{ .Values.kafka.tls.caKey }}
        {{- end }}
      {{- with .Values.emailService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.emailService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.emailService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
