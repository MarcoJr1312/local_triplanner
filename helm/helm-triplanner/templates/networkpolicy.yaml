{{- if and .Values.emailService.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triplanner-email
  labels:
    app.kubernetes.io/name: triplanner-email
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: triplanner-email
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The BYOK settings proxy is the only intended caller. Add the API chart's
    # pod label here once it exists.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: triplanner-api
      ports:
        - port: {{ .Values.emailService.service.port }}
          protocol: TCP
  egress:
    # Kafka bootstrap and broker ports.
    - ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Resend API.
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
