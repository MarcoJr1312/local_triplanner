apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: triplanner
  namespace: triplanner-agrocd
spec:
  project: triplanner
  sources:
    - repoURL: https://github.com/MarcoJr1312/local_triplanner
      # Follow the default branch after PR #1 was merged.
      targetRevision: HEAD
      path: helm/helm-triplanner
      helm:
        releaseName: triplanner
        valueFiles:
          - $values/deploy/kind/triplanner-values.yaml
    - repoURL: https://github.com/MarcoJr1312/local_triplanner
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: triplanner
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
  revisionHistoryLimit: 5
