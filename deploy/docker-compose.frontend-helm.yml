# Transitional overlay for the Cilium/Helm web frontend.
#
# The web pod reaches the still-Compose API through `host.docker.internal`
# (and, on the Cilium kind cluster, through the triplanner-host-proxy). Only the
# API port needs publishing; the agent is already a Helm workload.
#
# Do not use this overlay as the default demo stack; the default Compose demo
# publishes only the web. Remove it when the API moves into Helm.
#
# Usage:
#   docker compose \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.frontend-helm.yml \
#     up -d api agent
services:
  api:
    ports:
      - "0.0.0.0:4000:4000"
