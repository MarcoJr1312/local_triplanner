# Values for the isolated Cilium kind cluster. Images are loaded from the local
# Docker daemon by deploy/kind/setup-cilium.ps1 / setup-cilium.sh.
images:
  broker:
    name: triplanner-local/kafka
    tag: kind-0.13.0
  email:
    name: triplanner-local/email
    tag: kind-0.13.0
  locations:
    name: triplanner-local/locations
    tag: kind-0.13.0
  trips:
    name: triplanner-local/trips
    tag: kind-0.13.0
  users:
    name: triplanner-local/users
    tag: kind-0.13.0
  agent:
    name: triplanner-local/agent
    tag: kind-0.13.0
  web:
    name: triplanner-local/web
    tag: kind-0.13.0

# The API is still Compose. A host-network socat proxy reaches the Docker
# Desktop gateway; the web and agent use the proxy ClusterIP.
networkPolicy:
  # Docker Desktop's WSL2 kind kernel lacks xt_socket, so Cilium's DNS proxy
  # (required by toFQDNs) and the probe path are not usable here. Enable this on
  # a Cilium cluster with a compatible kernel; see deploy/kind/README.md.
  enabled: false
  probeCIDRs:
    - 10.244.0.73/32
    - 172.19.0.7/32
  email:
    extraFQDNs: []
  locations:
    extraFQDNs: []
  agent:
    extraFQDNs:
      - api.openai.com
      - api.anthropic.com
      - api.deepseek.com
    ollamaCIDRs: []
webService:
  backend:
    url: http://triplanner-host-proxy:4000/graphql
    origin: http://triplanner-host-proxy:4000
  backendProxy:
    enabled: true
    targetHost: 172.19.0.1
agentService:
  backend:
    url: http://triplanner-host-proxy:4000
