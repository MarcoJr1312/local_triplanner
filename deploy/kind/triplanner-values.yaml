# Values for the isolated Cilium kind cluster. Images are loaded from the local
# Docker daemon by deploy/kind/deploy-demo.ps1 / deploy-demo.sh.
images:
  broker:
    name: triplanner-local/kafka
    tag: kind-0.19.0
  email:
    name: triplanner-local/email
    tag: kind-0.19.0
  locations:
    name: triplanner-local/locations
    tag: kind-0.19.0
  trips:
    name: triplanner-local/trips
    tag: kind-0.19.0
  users:
    name: triplanner-local/users
    tag: kind-0.19.0
  agent:
    name: triplanner-local/agent
    tag: kind-0.19.0
  api:
    name: triplanner-local/api
    tag: kind-0.19.0
  web:
    name: triplanner-local/web
    tag: kind-0.19.0

# The kube-prometheus-stack release `prometheus` selects ServiceMonitors from
# all namespaces with `release: prometheus`. Dashboards are picked up by the
# Grafana sidecar (`grafana_dashboard=1`, all namespaces).
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
  dashboards:
    enabled: true

networkPolicy:
  # Docker Desktop's WSL2 kind kernel lacks xt_socket, so Cilium's DNS proxy
  # (required by toFQDNs) and the probe path are not usable here. Enable this on
  # a Cilium cluster with a compatible kernel; see deploy/kind/README.md.
  enabled: false
  probeCIDRs:
    - 10.244.0.73/32
    - 172.19.0.7/32
  email:
    extraFQDNs: []
  locations:
    extraFQDNs: []
  agent:
    extraFQDNs:
      - api.openai.com
      - api.anthropic.com
      - api.deepseek.com
    ollamaCIDRs: []
