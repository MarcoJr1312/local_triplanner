# prometheus-community/prometheus-postgres-exporter for the agent pgvector database.
fullnameOverride: triplanner-postgres-agent

config:
  datasource:
    host: triplanner-agent-postgres
    port: "5432"
    database: agent
    sslmode: disable
    userSecret:
      name: triplanner-postgres-agent-exporter
      key: username
    passwordSecret:
      name: triplanner-postgres-agent-exporter
      key: password

serviceMonitor:
  enabled: true
  interval: 30s
  timeout: 10s
  labels:
    release: prometheus

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

podSecurityContext:
  runAsGroup: 1001
  runAsUser: 1001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
