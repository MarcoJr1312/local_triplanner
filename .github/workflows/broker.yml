name: Broker - test and publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "backend/kafka/**"
      - ".github/workflows/broker.yml"
  pull_request:
    paths:
      - "backend/kafka/**"
      - ".github/workflows/broker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Broker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/kafka/go.mod
          cache-dependency-path: backend/kafka/go.sum
      - name: Test
        working-directory: backend/kafka
        run: go test ./...

  publish:
    name: Publish triplanner-kafka
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/triplanner-kafka
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/kafka/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
