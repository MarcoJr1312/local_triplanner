name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: triplanner
          POSTGRES_PASSWORD: triplanner
          POSTGRES_DB: triplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triplanner -d triplanner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        working-directory: backend/server
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: backend/server
        run: bunx tsc --noEmit
      - name: Test
        working-directory: backend/server
        run: bun test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        working-directory: frontend-next
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend-next
        run: bunx tsc --noEmit
      - name: Test
        working-directory: frontend-next
        run: bun test

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: triplanner
          POSTGRES_PASSWORD: triplanner
          POSTGRES_DB: triplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triplanner -d triplanner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        working-directory: backend/agent-service
        run: uv sync --frozen
      - name: Test
        working-directory: backend/agent-service
        run: uv run python tests/test_m2.py

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            ok=1
            for svc in postgres mongo api agent web; do
              status="$(docker inspect --format '{{.State.Health.Status}}' "local_triplanner-$svc" 2>/dev/null || true)"
              [ "$status" = "healthy" ] || ok=0
            done
            if [ "$ok" = "1" ]; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
