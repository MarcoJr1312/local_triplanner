name: Agent — test and publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "backend/agent-service/**"
      - "backend/db/pg/**"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "backend/agent-service/**"
      - "backend/db/pg/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: triplanner
          POSTGRES_PASSWORD: triplanner
          POSTGRES_DB: triplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triplanner -d triplanner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        working-directory: backend/agent-service
        run: uv sync --frozen
      - name: Test (backend/agent-service/tests/test_m2.py)
        working-directory: backend/agent-service
        run: uv run python tests/test_m2.py

  publish:
    name: Publish triplanner-agent
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/triplanner-agent
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/agent-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
