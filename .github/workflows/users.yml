name: Users service — test and publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "backend/users-service/**"
      - ".github/workflows/users.yml"
  pull_request:
    paths:
      - "backend/users-service/**"
      - ".github/workflows/users.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: users-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Users tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: users
          POSTGRES_PASSWORD: users
          POSTGRES_DB: users
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U users -d users"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_USERS_DATABASE_URL: postgres://users:users@127.0.0.1:5432/users
      TEST_USERS_ADMIN_URL: postgres://users:users@127.0.0.1:5432/postgres
      INTERNAL_TOKEN: ci-internal-token
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        working-directory: backend/users-service
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        working-directory: backend/users-service
        run: bun audit
      - name: Typecheck
        working-directory: backend/users-service
        run: bunx tsc --noEmit
      - name: Test
        working-directory: backend/users-service
        run: bun test

  publish:
    name: Publish triplanner-users
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/triplanner-users
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/users-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
