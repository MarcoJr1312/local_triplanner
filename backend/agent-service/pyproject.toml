[project]
name = "tripsuggest-agent-service"
version = "0.1.0"
description = "Triplanner local agent service: AI trip suggestions with FastAPI, Agno and pgvector"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "agno>=3.1.3",
    "openai>=1.50",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "numpy>=2.5.4",
    "anthropic>=2.8.0",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripsuggest"]
