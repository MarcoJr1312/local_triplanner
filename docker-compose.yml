# Local data stores for the recruiter demo.
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps volumes)
# Reset:  docker compose down -v       (drops data, demo-grade)
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: local_triplanner-postgres
    environment:
      POSTGRES_USER: triplanner
      POSTGRES_PASSWORD: triplanner
      POSTGRES_DB: triplanner
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triplanner -d triplanner"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Location catalogue: real Toronto places seeded from the committed dataset.
  mongo:
    image: mongo:7
    container_name: local_triplanner-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  mongodata:
