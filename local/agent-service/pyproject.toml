[project]
name = "tripsuggest-agent-service"
version = "0.1.0"
description = "Triplanner agent service: LLM travel suggestions (FastAPI + Agno + DeepSeek)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "agno>=3.1.3",
    "openai>=1.50",
    "chromadb>=0.5",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "boto3>=1.44.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripsuggest"]
